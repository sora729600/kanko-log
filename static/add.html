<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New Memory - Photo Diary</title>
  
  <!-- Leaflet (地図) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      font-family: Inter, "Noto Sans JP", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #3f3a40;
      background: #eee9e5;
      --ink: #3f3a40;
      --paper: rgba(255, 252, 249, .88);
      --gradient: linear-gradient(135deg, #a99ab6 0%, #9daea3 48%, #c4a0a5 100%);
      --shadow: 0 24px 70px rgba(84, 72, 80, .12);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(145deg, #efeae7 0%, #e9e8e2 48%, #eee6e6 100%);
      color: var(--ink);
    }
    .shell { width: min(760px, calc(100% - 32px)); margin: 36px auto 86px; display: grid; gap: 32px; }
    .card {
      border: 1px solid rgba(255,255,255,.64);
      background: var(--paper);
      backdrop-filter: blur(22px);
      box-shadow: var(--shadow);
      border-radius: 32px;
      padding: 28px;
    }
    .headline { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    h1 { margin: 4px 0 0; font-size: clamp(24px, 5vw, 36px); color: #373238; font-weight: 800; }
    .lead { margin: 8px 0 0; color: #80767c; font-size: 13px; }
    .eyebrow { margin: 0; color: #867a82; font-size: 10px; font-weight: 900; letter-spacing: .21em; }
    .pill {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px;
      border-radius: 999px; background: rgba(255,255,255,.6); color: #655d63;
      font-size: 12px; font-weight: 800; text-decoration: none; border: 1px solid rgba(0,0,0,.05);
    }
    #postForm { display: grid; gap: 20px; margin-top: 24px; }
    .field { display: grid; gap: 8px; font-size: 13px; font-weight: 800; color: #5b5258; }
    input, textarea {
      width: 100%; border: 1px solid rgba(111, 98, 106, .18); background: rgba(255,255,255,.8);
      color: var(--ink); border-radius: 16px; padding: 13px 15px; outline: none; font-size: 13px;
    }
    textarea { min-height: 80px; resize: vertical; }
    .preview-wrap {
      position: relative; overflow: hidden; border-radius: 24px; background: #ded8dd; border: 1px solid rgba(0,0,0,.08);
    }
    .preview-wrap > img { display: block; width: 100%; aspect-ratio: 4/5; object-fit: cover; }
    .music-box, .location-box {
      border: 1px solid rgba(126, 110, 120, .14); border-radius: 24px; padding: 18px;
      background: rgba(255,255,255,.55);
    }
    .search-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 10px; }
    .primary, .secondary { border: 0; border-radius: 16px; padding: 12px 16px; font-weight: 800; font-size: 13px; }
    .primary { background: var(--gradient); color: #fff; min-height: 50px; width: 100%; cursor: pointer; box-shadow: 0 8px 20px rgba(169,154,182,.3); }
    .secondary { background: rgba(255,255,255,.8); color: #5f565c; cursor: pointer; border: 1px solid rgba(0,0,0,.06); }
    .music-results { display: grid; gap: 8px; margin-top: 12px; max-height: 280px; overflow-y: auto; }
    .track {
      display: grid; grid-template-columns: 80px 1fr auto; align-items: center; gap: 12px;
      padding: 8px 10px; background: rgba(255,255,255,.9); border-radius: 16px; border: 1px solid rgba(0,0,0,.05);
    }
    .track > img { width: 80px; height: 48px; object-fit: cover; border-radius: 10px; }
    .track-info { min-width: 0; }
    .track-title { font-weight: 800; font-size: 12px; color: #333; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .track-artist { font-size: 11px; color: #777; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .track button { border: 0; border-radius: 10px; padding: 7px 12px; background: var(--gradient); color: #fff; font-weight: 800; font-size: 11px; cursor: pointer; }
    
    /* 写真の上の音楽オーバーレイカード */
    .music-overlay {
      position: absolute; left: 14px; right: 14px; bottom: 14px; display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 18px; background: rgba(45,38,46,.82); backdrop-filter: blur(16px); color: #fff;
      box-shadow: 0 8px 24px rgba(0,0,0,.2);
    }
    .music-overlay img { width: 56px; height: 32px; object-fit: cover; border-radius: 8px; shrink: 0; }
    .music-overlay .title { font-weight: 800; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .music-overlay .artist { font-size: 10px; opacity: 0.85; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #pickerMap { width: 100%; height: 220px; margin-top: 10px; border-radius: 18px; border: 1px solid rgba(0,0,0,.1); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="headline">
        <div>
          <p class="eyebrow">NEW MEMORY</p>
          <h1>写真に「今日の1曲」を。</h1>
          <p class="lead">その日の景色と音楽を、ひとつの思い出に。</p>
        </div>
        <a href="/" class="pill">← ホームへ戻る</a>
      </div>

      <form id="postForm">
        <!-- 1. 写真選択 -->
        <label class="field">
          <span>写真</span>
          <input id="image" name="file" type="file" accept="image/*,video/*" required />
        </label>

        <!-- プレビュー＆写真の上の音楽カード -->
        <div id="previewWrap" class="preview-wrap hidden">
          <img id="imagePreview" alt="投稿画像プレビュー" />
          <div id="musicOverlay" class="music-overlay hidden"></div>
        </div>

        <!-- 2. スポット名 -->
        <label class="field">
          <span>スポット名 / タイトル</span>
          <input id="spotName" name="name" type="text" placeholder="例：広安里海水浴場 / 釜山 DAY1" required />
        </label>

        <!-- 3. 場所を追加 (Map) -->
        <div class="location-box">
          <span style="font-size:13px; font-weight:800; color:#5b5258;">📍 場所を追加</span>
          <div class="search-row">
            <input id="locationQuery" type="text" placeholder="地名・観光地・施設名で検索" />
            <button type="button" id="searchLocationBtn" class="secondary">検索</button>
          </div>
          <div id="pickerMap"></div>
          <input type="hidden" id="selectedLat" name="latitude" value="35.6812" />
          <input type="hidden" id="selectedLng" name="longitude" value="139.7671" />
        </div>

        <!-- 4. ひとこと -->
        <label class="field">
          <span>ひとこと</span>
          <textarea name="memo" rows="3" placeholder="今日の思い出を書いてみよう"></textarea>
        </label>

        <!-- 5. 音楽を追加 (YouTube API連動) -->
        <div class="music-box">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:13px; font-weight:800; color:#5b5258;">🎵 音楽を追加</span>
            <button type="button" id="clearMusicBtn" class="secondary hidden" style="padding:4px 10px; font-size:11px;">選択解除</button>
          </div>
          <div class="search-row">
            <input id="musicQuery" type="search" placeholder="曲名・アーティスト名でYouTube検索" />
            <button type="button" id="searchMusicBtn" class="secondary">検索</button>
          </div>
          <p id="musicStatus" style="font-size:11px; color:#777; margin:8px 0 0;">YouTubeから曲やMVを検索して、この日の1曲として残せます。</p>
          <div id="musicResults" class="music-results"></div>
        </div>

        <button type="submit" id="submitBtn" class="primary">投稿する</button>
      </form>
    </section>
  </main>

  <script>
    let selectedVideo = null;
    let currentPreviewUrl = null;
    let map = null;
    let currentMarker = null;

    function getToken() { return localStorage.getItem("access_token"); }

    // 写真選択プレビュー
    document.getElementById("image").addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      if (currentPreviewUrl) URL.revokeObjectURL(currentPreviewUrl);
      currentPreviewUrl = URL.createObjectURL(file);
      document.getElementById("imagePreview").src = currentPreviewUrl;
      document.getElementById("previewWrap").classList.remove("hidden");
      renderMusicOverlay();
    });

    // YouTube 検索 (API: /api/music/search)
    const searchMusicBtn = document.getElementById("searchMusicBtn");
    const musicQuery = document.getElementById("musicQuery");
    const musicStatus = document.getElementById("musicStatus");
    const musicResults = document.getElementById("musicResults");
    const clearMusicBtn = document.getElementById("clearMusicBtn");

    searchMusicBtn.addEventListener("click", searchMusic);
    musicQuery.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); searchMusic(); } });

    async function searchMusic() {
      const q = musicQuery.value.trim();
      if (!q) return;

      searchMusicBtn.disabled = true;
      musicStatus.textContent = "YouTubeで検索中...";
      musicResults.innerHTML = "";

      try {
        const res = await fetch(`/api/music/search?q=${encodeURIComponent(q)}&limit=10`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "検索に失敗しました");

        if (!data.items || data.items.length === 0) {
          musicStatus.textContent = "曲が見つかりませんでした。";
          return;
        }

        musicStatus.textContent = `${data.items.length}件見つかりました。選択してください。`;
        data.items.forEach((video) => {
          const row = document.createElement("div");
          row.className = "track";
          row.innerHTML = `
            <img src="${video.cover_url || ''}" alt="">
            <div class="track-info">
              <div class="track-title">${escapeHtml(video.title || '')}</div>
              <div class="track-artist">${escapeHtml(video.artist || '')}</div>
            </div>
            <button type="button">選択</button>
          `;
          row.querySelector("button").addEventListener("click", () => {
            selectedVideo = video;
            clearMusicBtn.classList.remove("hidden");
            musicStatus.textContent = `選択中: ${video.title} — ${video.artist}`;
            renderMusicOverlay();
          });
          musicResults.appendChild(row);
        });
      } catch (err) {
        musicStatus.textContent = err.message;
      } finally {
        searchMusicBtn.disabled = false;
      }
    }

    clearMusicBtn.addEventListener("click", () => {
      selectedVideo = null;
      clearMusicBtn.classList.add("hidden");
      musicStatus.textContent = "音楽選択を解除しました。";
      renderMusicOverlay();
    });

    function renderMusicOverlay() {
      const overlay = document.getElementById("musicOverlay");
      if (!selectedVideo || document.getElementById("previewWrap").classList.contains("hidden")) {
        overlay.classList.add("hidden");
        return;
      }
      overlay.classList.remove("hidden");
      overlay.innerHTML = `
        ${selectedVideo.cover_url ? `<img src="${escapeHtml(selectedVideo.cover_url)}">` : ''}
        <div style="min-width:0;">
          <div class="title">▶ ${escapeHtml(selectedVideo.title || '')}</div>
          <div class="artist">${escapeHtml(selectedVideo.artist || '')} · YouTube</div>
        </div>
      `;
    }

    // 地図機能
    function initMap() {
      map = L.map('pickerMap', { zoomControl: true }).setView([35.6812, 139.7671], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      currentMarker = L.marker([35.6812, 139.7671], { draggable: true }).addTo(map);

      map.on('click', (e) => setCoordinates(e.latlng.lat, e.latlng.lng));
      currentMarker.on('dragend', () => {
        const pos = currentMarker.getLatLng();
        setCoordinates(pos.lat, pos.lng);
      });
    }

    function setCoordinates(lat, lng) {
      currentMarker.setLatLng([lat, lng]);
      document.getElementById('selectedLat').value = lat;
      document.getElementById('selectedLng').value = lng;
    }

    document.getElementById("searchLocationBtn").addEventListener("click", async () => {
      const q = document.getElementById("locationQuery").value.trim();
      if (!q) return;
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`);
        const data = await res.json();
        if (data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lon = parseFloat(data[0].lon);
          setCoordinates(lat, lon);
          map.setView([lat, lon], 15);
        }
      } catch (e) {}
    });

    // フォーム送信
    document.getElementById("postForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const token = getToken();
      if (!token) {
        alert("ログインが必要です");
        window.location.href = "/";
        return;
      }

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.textContent = "投稿中...";

      try {
        const formData = new FormData(e.target);

        // 日時補完
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        formData.append("visited_at", now.toISOString());

        // 選択されたYouTube楽曲のパラメータ追加
        if (selectedVideo) {
          const videoId = selectedVideo.youtube_video_id || selectedVideo.id;
          if (videoId) {
            formData.append("youtube_video_id", videoId);
          }
          let currentMemo = formData.get("memo") || "";
          formData.set("memo", (currentMemo + `\n\n🎵 ${selectedVideo.title}\nhttps://www.youtube.com/watch?v=${videoId}`).trim());
        }

        const res = await fetch("/spots/upload", {
          method: "POST",
          headers: { "Authorization": `Bearer ${token}` },
          body: formData
        });

        if (res.ok) {
          window.location.href = "/";
        } else {
          const err = await res.json();
          alert(err.detail || "投稿に失敗しました");
        }
      } catch (err) {
        alert("通信エラーが発生しました");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "投稿する";
      }
    });

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    window.addEventListener("DOMContentLoaded", initMap);
  </script>
</body>
</html>
