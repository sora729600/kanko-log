<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Log - TRAVEL LOG</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --tl-ink: #302a38;
      --tl-paper: #fffaf7;
    }
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      color: var(--tl-ink);
      background: linear-gradient(145deg, #efeae7 0%, #e9e8e2 50%, #eee6e6 100%);
      min-height: 100vh;
    }
    .navy-card {
      background: var(--tl-paper);
      border: 2px solid var(--tl-ink);
      box-shadow: 4px 4px 0px rgba(48,42,56,.15);
    }
    .navy-input {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      color: var(--tl-ink);
      transition: all 0.2s;
    }
    .navy-input:focus {
      border-color: var(--tl-ink);
      box-shadow: 2px 2px 0px var(--tl-ink);
      outline: none;
    }
    .navy-btn {
      background-color: var(--tl-ink);
      color: #ffffff;
      transition: all 0.15s ease;
    }
    .navy-btn:hover {
      background-color: #1e293b;
      transform: translateY(-1px);
    }
  </style>
</head>
<body class="p-4 sm:p-6">

  <div class="max-w-md mx-auto">
    <!-- ヘッダー部分 -->
    <div class="flex items-center justify-between mb-4">
      <div>
        <h1 class="text-base font-bold tracking-[0.18em] uppercase text-slate-900">NEW LOG</h1>
        <p class="text-[10px] text-slate-500 font-medium">思い出を記録する</p>
      </div>
      <button onclick="window.location.href='/'" class="text-xs font-bold text-slate-500 hover:text-slate-900 px-3 py-1.5 rounded-full border border-slate-300 bg-white">
        ✕ キャンセル
      </button>
    </div>

    <!-- メインフォームカード -->
    <div class="navy-card rounded-3xl p-5 sm:p-6">
      <form id="postForm" class="space-y-4">

        <!-- 1. 場所検索 & マップピン留め -->
        <div>
          <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">1. Spot Location (場所の検索)</label>
          <div class="flex gap-2 mb-2">
            <input type="text" id="searchLocationInput" class="w-full rounded-xl p-2.5 text-xs navy-input" placeholder="地名やスポット名を入力...">
            <button type="button" id="searchLocationBtn" class="navy-btn font-semibold px-4 rounded-xl text-xs tracking-wider">Search</button>
          </div>
          <div id="searchSuggestions" class="hidden mb-2 bg-white rounded-xl border border-slate-200 shadow-lg max-h-40 overflow-y-auto divide-y divide-slate-100 text-xs"></div>
          
          <div id="pickerMap" class="w-full h-44 rounded-2xl border-2 border-slate-900 overflow-hidden"></div>
          <input type="hidden" id="selectedLat" name="latitude" value="35.6812">
          <input type="hidden" id="selectedLng" name="longitude" value="139.7671">
        </div>

        <!-- 2. スポット名 -->
        <div>
          <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">2. Spot Name (スポット名)</label>
          <input type="text" id="spotNameInput" name="name" required class="w-full rounded-xl p-2.5 text-xs navy-input" placeholder="例: 東京タワー">
        </div>

        <!-- 3. 訪問日時 -->
        <div>
          <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">3. Visited Date & Time (訪問日時)</label>
          <input type="datetime-local" id="visitedAtInput" name="visited_at" class="w-full rounded-xl p-2.5 text-xs navy-input text-slate-800">
        </div>

        <!-- 4. 今日の1曲 (YouTube検索) -->
        <div>
          <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">4. Today's Music (今日の1曲)</label>
          <div class="flex gap-2">
            <input type="text" id="musicSearchInput" class="w-full rounded-xl p-2.5 text-xs navy-input" placeholder="曲名やアーティスト名でYouTube検索...">
            <button type="button" id="musicSearchBtn" class="navy-btn font-semibold px-4 rounded-xl text-xs tracking-wider">Search</button>
          </div>
          <div id="musicResults" class="hidden mt-2 max-h-44 overflow-y-auto divide-y divide-slate-100 border border-slate-200 rounded-xl bg-white text-xs"></div>
          <input type="hidden" id="selectedMusicUrl" name="music_url" value="">
          <input type="hidden" id="selectedMusicTitle" name="music_title" value="">
          
          <div id="musicPreview" class="hidden mt-2 p-2.5 bg-indigo-50/60 border border-indigo-200 rounded-xl flex items-center justify-between text-xs">
            <span id="musicPreviewTitle" class="font-bold text-indigo-950 truncate max-w-[220px]"></span>
            <button type="button" onclick="clearMusicSelection()" class="text-rose-500 font-bold text-[10px]">削除 ✕</button>
          </div>
        </div>

        <!-- 5. メディア添付 -->
        <div>
          <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">5. Photo / Video (写真・動画)</label>
          <input type="file" name="file" accept="image/*,video/*" class="w-full text-xs text-slate-600 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border file:border-slate-300 file:text-xs file:font-semibold file:bg-slate-50 file:text-slate-800">
        </div>

        <!-- 6. メモ -->
        <div>
          <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">6. Note (メモ)</label>
          <textarea id="memoInput" name="memo" rows="3" class="w-full rounded-xl p-2.5 text-xs navy-input placeholder-slate-400" placeholder="感想や思い出のメモ..."></textarea>
        </div>

        <!-- 送信ボタン -->
        <div class="pt-2">
          <button type="submit" id="submitBtn" class="w-full navy-btn font-bold py-3.5 rounded-xl text-xs tracking-[0.18em] uppercase shadow-md transition">
            Post Log (思い出を投稿)
          </button>
        </div>

      </form>
    </div>
  </div>

  <script>
    let map = null;
    let currentMarker = null;

    function getToken() { return localStorage.getItem('access_token'); }

    // 日時初期設定
    function setInitialVisitedAt() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById('visitedAtInput').value = now.toISOString().slice(0, 16);
    }

    // 地図初期化
    function initMap() {
      map = L.map('pickerMap', { zoomControl: false }).setView([35.6812, 139.7671], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      currentMarker = L.marker([35.6812, 139.7671]).addTo(map);

      map.on('click', (e) => {
        setCoordinates(e.latlng.lat, e.latlng.lng);
      });
    }

    function setCoordinates(lat, lng, zoom = null) {
      currentMarker.setLatLng([lat, lng]);
      if (zoom && map) map.setView([lat, lng], zoom);
      document.getElementById('selectedLat').value = lat;
      document.getElementById('selectedLng').value = lng;
    }

    // 場所検索
    const searchLocationInput = document.getElementById('searchLocationInput');
    const searchLocationBtn = document.getElementById('searchLocationBtn');
    const searchSuggestions = document.getElementById('searchSuggestions');
    const spotNameInput = document.getElementById('spotNameInput');

    async function executePlaceSearch() {
      const q = searchLocationInput.value.trim();
      if (!q) return;

      searchLocationBtn.innerText = '...';
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=5`);
        const results = await res.json();

        searchSuggestions.innerHTML = '';
        if (results.length === 0) {
          searchSuggestions.innerHTML = '<div class="p-3 text-slate-400">見つかりませんでした</div>';
          searchSuggestions.classList.remove('hidden');
          return;
        }

        const top = results[0];
        setCoordinates(parseFloat(top.lat), parseFloat(top.lon), 16);
        if (!spotNameInput.value) spotNameInput.value = q;

        searchSuggestions.innerHTML = results.map(item => `
          <div class="p-2.5 hover:bg-slate-50 cursor-pointer transition flex items-center justify-between text-slate-700" 
               onclick="selectSuggestion('${item.display_name.replace(/'/g, "\\'")}', ${item.lat}, ${item.lon})">
            <span class="truncate mr-2 font-medium">${item.display_name}</span>
            <span class="text-slate-900 text-[10px] font-bold tracking-wider shrink-0">SELECT ↗</span>
          </div>
        `).join('');
        searchSuggestions.classList.remove('hidden');
      } catch (err) {
        console.error(err);
      } finally {
        searchLocationBtn.innerText = 'Search';
      }
    }

    window.selectSuggestion = function(name, lat, lon) {
      setCoordinates(parseFloat(lat), parseFloat(lon), 16);
      const shortName = name.split(',')[0];
      spotNameInput.value = shortName;
      searchLocationInput.value = shortName;
      searchSuggestions.classList.add('hidden');
    };

    searchLocationBtn.addEventListener('click', executePlaceSearch);
    searchLocationInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); executePlaceSearch(); }
    });

    // YouTube 音楽検索
    const musicSearchInput = document.getElementById('musicSearchInput');
    const musicSearchBtn = document.getElementById('musicSearchBtn');
    const musicResults = document.getElementById('musicResults');

    async function executeMusicSearch() {
      const q = musicSearchInput.value.trim();
      if (!q) return;

      musicSearchBtn.innerText = '...';
      try {
        const res = await fetch(`https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`);
        const text = await res.text();
        
        // 簡易的なHTMLパース処理（VideoID抽出）
        const matches = [...text.matchAll(/"videoId":"([A-Za-z0-9_-]{11})".*?"title":{"runs":\[{"text":"(.*?)"\}\]}/g)];
        
        if (matches.length === 0) {
          musicResults.innerHTML = '<div class="p-3 text-slate-400">見つかりませんでした</div>';
          musicResults.classList.remove('hidden');
          return;
        }

        const unique = [];
        const seen = new Set();
        for (const m of matches) {
          if (!seen.has(m[1]) && unique.length < 5) {
            seen.add(m[1]);
            unique.push({ id: m[1], title: m[2] });
          }
        }

        musicResults.innerHTML = unique.map(item => `
          <div class="p-2.5 hover:bg-slate-50 cursor-pointer transition flex items-center justify-between text-slate-700"
               onclick="selectMusic('${item.id}', '${item.title.replace(/'/g, "\\'")}')">
            <span class="truncate mr-2 font-medium">${item.title}</span>
            <span class="text-indigo-600 text-[10px] font-bold tracking-wider shrink-0">SELECT 🎵</span>
          </div>
        `).join('');
        musicResults.classList.remove('hidden');
      } catch (err) {
        alert('音楽検索に失敗しました');
      } finally {
        musicSearchBtn.innerText = 'Search';
      }
    }

    window.selectMusic = function(id, title) {
      document.getElementById('selectedMusicUrl').value = `https://www.youtube.com/watch?v=${id}`;
      document.getElementById('selectedMusicTitle').value = title;
      document.getElementById('musicPreviewTitle').innerText = `🎵 ${title}`;
      document.getElementById('musicPreview').classList.remove('hidden');
      musicResults.classList.add('hidden');
      musicSearchInput.value = '';
    };

    window.clearMusicSelection = function() {
      document.getElementById('selectedMusicUrl').value = '';
      document.getElementById('selectedMusicTitle').value = '';
      document.getElementById('musicPreview').classList.add('hidden');
    };

    musicSearchBtn.addEventListener('click', executeMusicSearch);
    musicSearchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); executeMusicSearch(); }
    });

    // フォーム送信処理
    document.getElementById('postForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = getToken();
      if (!token) {
        alert('ログインが必要です');
        window.location.href = '/';
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Uploading...';

      const formData = new FormData(e.target);

      // 音楽情報をメモ（memo）の末尾へ追加統合
      const musicUrl = document.getElementById('selectedMusicUrl').value;
      const musicTitle = document.getElementById('selectedMusicTitle').value;
      if (musicUrl && musicTitle) {
        let currentMemo = formData.get('memo') || '';
        const musicBlock = `\n\n🎵 ${musicTitle}\n${musicUrl}`;
        formData.set('memo', currentMemo + musicBlock);
      }

      try {
        const res = await fetch('/spots/upload', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData
        });

        if (res.ok) {
          window.location.href = '/';
        } else {
          const errData = await res.json();
          alert(errData.detail || '投稿に失敗しました');
        }
      } catch (err) {
        alert('通信エラーが発生しました');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Post Log (思い出を投稿)';
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      setInitialVisitedAt();
      initMap();
    });
  </script>
</body>
</html>
