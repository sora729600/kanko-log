<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photo Diary | 今日の1曲</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
:root {
  font-family: Inter, "Noto Sans JP", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #3f3a40;
  background: #eee9e5;
  --ink: #3f3a40;
  --paper: rgba(255, 252, 249, .76);
  --gradient: linear-gradient(135deg, #a99ab6 0%, #9daea3 48%, #c4a0a5 100%);
  --shadow: 0 24px 70px rgba(84, 72, 80, .12);
}
* { box-sizing: border-box; }
body {
  min-height: 100vh;
  margin: 0;
  background: linear-gradient(145deg, #efeae7 0%, #e9e8e2 48%, #eee6e6 100%);
  color: var(--ink);
}
.shell { width: min(780px, calc(100% - 32px)); margin: 44px auto 86px; display: grid; gap: 40px; }
.card {
  border: 1px solid rgba(255,255,255,.64);
  background: var(--paper);
  backdrop-filter: blur(22px);
  box-shadow: var(--shadow);
  border-radius: 32px;
  padding: 30px;
}
.headline { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
h1 { margin: 4px 0 0; font-size: clamp(28px, 5vw, 42px); color: #373238; }
.lead { margin: 10px 0 0; color: #80767c; font-size: 14px; }
.eyebrow { margin: 0; color: #867a82; font-size: 10px; font-weight: 900; letter-spacing: .21em; }
.pill {
  display: inline-flex; align-items: center; gap: 8px; padding: 9px 12px;
  border-radius: 999px; background: rgba(255,255,255,.48); color: #655d63;
  font-size: 11px; font-weight: 800; text-decoration: none;
}
#postForm { display: grid; gap: 19px; margin-top: 26px; }
.field { display: grid; gap: 9px; font-size: 13px; font-weight: 800; color: #5b5258; }
input, textarea {
  width: 100%; border: 1px solid rgba(111, 98, 106, .16); background: rgba(255,255,255,.67);
  color: var(--ink); border-radius: 17px; padding: 14px 15px; outline: none;
}
textarea { min-height: 98px; resize: vertical; }
.preview-wrap {
  position: relative; overflow: hidden; border-radius: 25px; background: #ded8dd;
}
.preview-wrap > img { display: block; width: 100%; aspect-ratio: 4/5; object-fit: cover; }
.music-box, .location-box {
  border: 1px solid rgba(126, 110, 120, .12); border-radius: 24px; padding: 18px;
  background: rgba(255,255,255,.48);
}
.search-row, .location-search-row { display: grid; grid-template-columns: 1fr auto auto; gap: 9px; margin-top: 14px; }
.primary, .secondary { border: 0; border-radius: 16px; padding: 13px 17px; font-weight: 900; }
.primary { background: var(--gradient); color: #fff; min-height: 52px; width: 100%; }
.secondary { background: rgba(255,255,255,.62); color: #5f565c; }
.music-results, .location-results { display: grid; gap: 9px; margin-top: 13px; max-height: 250px; overflow: auto; }
.track {
  display: grid; grid-template-columns: 92px 1fr auto; align-items: center; gap: 12px;
  padding: 10px; background: rgba(255,255,255,.66); border-radius: 17px;
}
.track > img { width: 92px; height: 52px; object-fit: cover; border-radius: 11px; }
.track button { border: 0; border-radius: 12px; padding: 9px 11px; background: var(--gradient); color: #fff; font-weight: 900; }
.music-overlay {
  position: absolute; left: 15px; right: 15px; bottom: 15px; display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 18px; background: rgba(87,70,88,.75); backdrop-filter: blur(17px); color: #fff;
}
.music-overlay img { width: 62px; height: 35px; object-fit: cover; border-radius: 9px; }
#travelMap { width: 100%; height: 260px; margin-top: 13px; border-radius: 20px; overflow: hidden; }
.hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="shell">
    <section class="composer card">
      <div class="headline">
        <div>
          <p class="eyebrow">NEW MEMORY</p>
          <h1>写真に「今日の1曲」を。</h1>
          <p class="lead">その日の景色と音楽を、ひとつの思い出に。</p>
        </div>
        <a href="/" class="pill">← ホームへ戻る</a>
      </div>

      <form id="postForm">
        <!-- 1. 写真選択 -->
        <label class="field">
          <span>写真</span>
          <input id="image" name="file" type="file" accept="image/*,video/*" required />
        </label>

        <!-- プレビュー＆黒い音楽カード -->
        <div id="previewWrap" class="preview-wrap hidden">
          <img id="imagePreview" alt="投稿画像プレビュー" />
          <div id="musicOverlay" class="music-overlay hidden"></div>
        </div>

        <!-- 2. スポット名 -->
        <label class="field">
          <span>スポット名 / タイトル</span>
          <input id="travelSpotName" name="name" type="text" placeholder="例：広安里海水浴場 / 釜山 DAY1" required />
        </label>

        <!-- 3. 場所を追加 (Map) -->
        <div class="location-box">
          <strong class="section-label">📍 場所を追加</strong>
          <div class="location-search-row">
            <input id="locationQuery" type="search" placeholder="地名・観光地・施設名で検索" />
            <button type="button" id="searchLocation" class="secondary">検索</button>
            <button type="button" id="useCurrentLocation" class="secondary">現在地</button>
          </div>
          <div id="locationResults" class="location-results"></div>
          <div id="travelMap"></div>
          <p id="locationStatus" class="muted" style="margin-top:8px; font-size:11px;">ピンを立てて場所を選択してください。</p>
        </div>

        <!-- 4. ひとこと -->
        <label class="field">
          <span>ひとこと</span>
          <textarea name="memo" rows="3" placeholder="今日の思い出を書いてみよう"></textarea>
        </label>

        <!-- 5. 音楽を追加 (YouTube API連動) -->
        <div class="music-box">
          <div class="headline">
            <strong>🎵 音楽を追加</strong>
            <button type="button" id="clearMusic" class="secondary hidden" style="padding:4px 8px; font-size:11px;">選択解除</button>
          </div>
          <div class="search-row">
            <input id="musicQuery" type="search" placeholder="曲名・アーティスト名で検索" />
            <button type="button" id="searchMusic" class="secondary">検索</button>
          </div>
          <p id="musicMessage" class="muted" style="font-size:12px; margin-top:8px;">YouTubeから曲やMVを検索して、この日の1曲として残せます。</p>
          <div id="musicResults" class="music-results"></div>
        </div>

        <button type="submit" class="primary">投稿する</button>
      </form>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const postForm = document.getElementById("postForm");
    const imageInput = document.getElementById("image");
    const imagePreview = document.getElementById("imagePreview");
    const previewWrap = document.getElementById("previewWrap");
    const musicOverlay = document.getElementById("musicOverlay");
    const musicQuery = document.getElementById("musicQuery");
    const searchMusicButton = document.getElementById("searchMusic");
    const musicResults = document.getElementById("musicResults");
    const musicMessage = document.getElementById("musicMessage");
    const clearMusicButton = document.getElementById("clearMusic");

    let selectedVideo = null;
    let currentPreviewUrl = null;
    let travelMap = null;
    let travelMarker = null;
    let selectedLatitude = 35.6812;
    let selectedLongitude = 139.7671;

    function getToken() { return localStorage.getItem("access_token"); }

    // 画像プレビュー
    imageInput.addEventListener("change", () => {
      const file = imageInput.files?.[0];
      if (!file) return;
      if (currentPreviewUrl) URL.revokeObjectURL(currentPreviewUrl);
      currentPreviewUrl = URL.createObjectURL(file);
      imagePreview.src = currentPreviewUrl;
      previewWrap.classList.remove("hidden");
      renderSelectedMusic();
    });

    // 地図初期化
    function initMap() {
      travelMap = L.map("travelMap").setView([selectedLatitude, selectedLongitude], 13);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(travelMap);
      travelMarker = L.marker([selectedLatitude, selectedLongitude], { draggable: true }).addTo(travelMap);

      travelMap.on("click", (e) => setCoordinates(e.latlng.lat, e.latlng.lng));
      travelMarker.on("dragend", () => {
        const pos = travelMarker.getLatLng();
        setCoordinates(pos.lat, pos.lng);
      });
    }

    function setCoordinates(lat, lng) {
      selectedLatitude = lat;
      selectedLongitude = lng;
      travelMarker.setLatLng([lat, lng]);
      document.getElementById("locationStatus").textContent = `選択中: 緯度 ${lat.toFixed(4)}, 経度 ${lng.toFixed(4)}`;
    }

    document.getElementById("searchLocation").addEventListener("click", async () => {
      const q = document.getElementById("locationQuery").value.trim();
      if (!q) return;
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`);
      const data = await res.json();
      if (data.length > 0) {
        setCoordinates(parseFloat(data[0].lat), parseFloat(data[0].lon));
        travelMap.setView([data[0].lat, data[0].lon], 15);
      }
    });

    document.getElementById("useCurrentLocation").addEventListener("click", () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((p) => {
          setCoordinates(p.coords.latitude, p.coords.longitude);
          travelMap.setView([p.coords.latitude, p.coords.longitude], 15);
        });
      }
    });

    // YouTube検索 API (/api/music/search)
    searchMusicButton.addEventListener("click", searchMusic);
    async function searchMusic() {
      const q = musicQuery.value.trim();
      if (!q) return;
      searchMusicButton.disabled = true;
      musicMessage.textContent = "YouTubeで検索中...";
      musicResults.innerHTML = "";

      try {
        const res = await fetch(`/api/music/search?q=${encodeURIComponent(q)}&limit=10`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "検索失敗");

        musicMessage.textContent = `${data.items.length}件見つかりました。`;
        data.items.forEach((video) => {
          const row = document.createElement("div");
          row.className = "track";
          row.innerHTML = `
            <img src="${video.cover_url || ''}" alt="">
            <div>
              <div style="font-bold text-xs">${video.title || ''}</div>
              <div style="text-xs color:#777">${video.artist || ''}</div>
            </div>
            <button type="button">選ぶ</button>
          `;
          row.querySelector("button").addEventListener("click", () => {
            selectedVideo = video;
            clearMusicButton.classList.remove("hidden");
            renderSelectedMusic();
          });
          musicResults.appendChild(row);
        });
      } catch (e) {
        musicMessage.textContent = e.message;
      } finally {
        searchMusicButton.disabled = false;
      }
    }

    clearMusicButton.addEventListener("click", () => {
      selectedVideo = null;
      clearMusicButton.classList.add("hidden");
      renderSelectedMusic();
    });

    function renderSelectedMusic() {
      if (!selectedVideo || previewWrap.classList.contains("hidden")) {
        musicOverlay.classList.add("hidden");
        return;
      }
      musicOverlay.classList.remove("hidden");
      musicOverlay.innerHTML = `
        ${selectedVideo.cover_url ? `<img src="${selectedVideo.cover_url}">` : ''}
        <div>
          <div style="font-weight:800; font-size:12px;">▶ ${selectedVideo.title}</div>
          <div style="font-size:10px; opacity:0.8">${selectedVideo.artist} · YouTube</div>
        </div>
      `;
    }

    // 送信
    postForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const token = getToken();
      if (!token) { alert("ログインしてください"); return; }

      const formData = new FormData(postForm);
      formData.append("latitude", String(selectedLatitude));
      formData.append("longitude", String(selectedLongitude));
      
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      formData.append("visited_at", now.toISOString());

      if (selectedVideo) {
        formData.append("youtube_video_id", selectedVideo.youtube_video_id || "");
        let memo = formData.get("memo") || "";
        formData.set("memo", memo + `\n\n🎵 ${selectedVideo.title}\nhttps://www.youtube.com/watch?v=${selectedVideo.youtube_video_id}`);
      }

      const res = await fetch("/spots/upload", {
        method: "POST",
        headers: { "Authorization": `Bearer ${token}` },
        body: formData
      });

      if (res.ok) {
        window.location.href = "/";
      } else {
        alert("投稿に失敗しました");
      }
    });

    window.addEventListener("DOMContentLoaded", initMap);
  </script>
</body>
</html>
