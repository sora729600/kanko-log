<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRAVEL LOG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --tl-ink: #302a38;
      --tl-muted: #7a7180;
      --tl-paper: #fffaf7;
    }
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      color: var(--tl-ink);
      background: linear-gradient(145deg, #efeae7 0%, #e9e8e2 50%, #eee6e6 100%) !important;
      background-attachment: fixed !important;
      min-height: 100vh;
    }
    .navy-card {
      background: var(--tl-paper);
      border: 2px solid var(--tl-ink);
      box-shadow: 4px 4px 0px rgba(48,42,56,.15);
    }
    .navy-input {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      color: var(--tl-ink);
    }
    .navy-btn {
      background-color: var(--tl-ink);
      color: #ffffff;
    }
    .navy-btn-outline {
      border: 1.5px solid var(--tl-ink);
      color: var(--tl-ink);
      background: transparent;
    }
  </style>
</head>
<body class="selection:bg-slate-900 selection:text-white">

  <!-- 未ログイン画面 -->
  <div id="landingView" class="hidden min-h-screen flex flex-col justify-between max-w-md mx-auto p-6">
    <div class="pt-8">
      <div class="inline-block px-3 py-1 bg-slate-900 text-white text-[9px] font-bold tracking-[0.25em] uppercase rounded-full mb-4">Official Travel Journal</div>
      <h1 class="text-3xl font-extrabold tracking-[0.18em] text-slate-900 leading-tight uppercase">Travel<br>Log.</h1>
      <p class="text-xs text-slate-500 mt-2 font-medium tracking-wider">地図と写真で記録する、あなただけの旅路のアーカイブ</p>
    </div>

    <div class="bg-white border-2 border-slate-900 rounded-2xl p-5 shadow-[4px_4px_0px_#0f172a] my-6">
      <h2 id="gateTitle" class="text-xs font-bold tracking-widest text-slate-900 uppercase mb-4">SIGN IN TO YOUR LOG</h2>
      <form id="gateAuthForm" class="space-y-3">
        <div>
          <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">User ID (@username)</label>
          <input type="text" id="gateUsername" required class="w-full rounded-xl p-2.5 text-xs navy-input">
        </div>
        <div id="gateDisplayNameContainer" class="hidden">
          <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Display Name (表示名)</label>
          <input type="text" id="gateDisplayName" class="w-full rounded-xl p-2.5 text-xs navy-input">
        </div>
        <div id="gateEmailContainer" class="hidden">
          <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Email</label>
          <input type="email" id="gateEmail" class="w-full rounded-xl p-2.5 text-xs navy-input">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Password</label>
          <input type="password" id="gatePassword" required class="w-full rounded-xl p-2.5 text-xs navy-input">
        </div>
        <button type="submit" id="gateSubmitBtn" class="w-full navy-btn font-bold py-3 rounded-xl text-xs tracking-[0.18em] uppercase">Enter Travel Log</button>
      </form>
      <div id="gateStatusMessage" class="hidden mt-3 rounded-xl border px-3 py-2 text-[11px]"></div>
      <div class="mt-4 text-center">
        <button type="button" id="gateToggleBtn" class="text-[11px] text-slate-500 font-semibold underline">アカウントを新規作成する</button>
      </div>
    </div>
  </div>

  <!-- ログイン後メイン画面 -->
  <div id="appView" class="hidden max-w-md mx-auto min-h-screen flex flex-col justify-between pb-12">
    <!-- ヘッダー (プロフィール表示復元) -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md px-5 py-3.5 flex items-center justify-between border-b border-slate-900">
      <div>
        <h1 class="text-base font-bold tracking-[0.2em] text-slate-900 uppercase cursor-pointer" onclick="switchFeedTab('all')">Travel Log</h1>
        <p class="text-[9px] tracking-[0.25em] text-slate-500 uppercase font-medium">Archive of Moments</p>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="openUserSearchModal()" class="text-slate-700 p-1" title="ユーザー検索">🔍</button>
        <button onclick="openNotificationsModal()" class="text-slate-700 p-1 relative" title="通知">
          🔔<span id="notifBadge" class="hidden absolute top-1 right-1 w-2 h-2 bg-rose-500 rounded-full"></span>
        </button>
        <button onclick="openConversationsModal()" class="text-slate-700 p-1" title="DM">✉️</button>

        <!-- プロフィール／アカウント表示領域 -->
        <div id="authStatusContainer"></div>

        <!-- 相方様の投稿画面（add.html）へ移動するボタン -->
        <a href="/static/add.html" class="navy-btn text-xs font-bold px-3 py-1.5 rounded-full flex items-center gap-1">
          <span>+</span>
        </a>
      </div>
    </header>

    <!-- フィード切り替え -->
    <div class="px-4 pt-3 flex items-center gap-4 text-xs font-bold tracking-wider border-b border-slate-200">
      <button id="tabAll" onclick="switchFeedTab('all')" class="pb-2 text-slate-900 border-b-2 border-slate-900">ALL</button>
      <button id="tabFollowing" onclick="switchFeedTab('following')" class="pb-2 text-slate-400">FOLLOWING</button>
    </div>

    <!-- メインフィード -->
    <main class="p-4 flex-1">
      <div id="feed" class="space-y-7">
        <p class="text-center text-xs text-slate-400 py-12">Loading...</p>
      </div>
    </main>

    <!-- プロフィールモーダル -->
    <div id="profileModal" class="modal-overlay fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm hidden flex items-center justify-center p-4" onclick="handleBackdropClick(event, closeProfileModal)">
      <div class="bg-white border-2 border-slate-900 w-full max-w-sm rounded-3xl p-6 shadow-2xl relative">
        <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-900">
          <span class="text-[10px] font-mono tracking-widest uppercase font-bold text-slate-900">Profile</span>
          <button onclick="closeProfileModal()" class="text-slate-400 font-bold">✕</button>
        </div>
        <div class="space-y-4">
          <div id="profileCover" class="w-full h-24 border border-slate-900 rounded-xl bg-slate-100 bg-cover bg-center"></div>
          <div class="flex items-start gap-3">
            <div id="profileAvatar" class="w-14 h-14 rounded-xl border-2 border-slate-900 bg-slate-100 bg-cover bg-center shrink-0 flex items-center justify-center font-bold text-lg"></div>
            <div class="flex-1 min-w-0">
              <h2 id="profileDisplayName" class="text-base font-extrabold text-slate-900 truncate"></h2>
              <p id="profileUsername" class="text-[11px] text-slate-400 font-mono"></p>
              <div id="profileActionContainer" class="mt-2 flex gap-1.5"></div>
            </div>
          </div>
          <p id="profileBio" class="text-xs text-slate-700 bg-slate-50 p-2.5 rounded-lg border-l-2 border-slate-900"></p>
          <div class="grid grid-cols-2 gap-2 font-mono">
            <div class="border border-slate-200 rounded-xl p-2 text-center cursor-pointer" onclick="openUserListModal('following')">
              <span class="text-[9px] text-slate-400 block uppercase">Following</span>
              <span id="profileFollowingCount" class="text-xs font-bold text-slate-900">0</span>
            </div>
            <div class="border border-slate-200 rounded-xl p-2 text-center cursor-pointer" onclick="openUserListModal('followers')">
              <span class="text-[9px] text-slate-400 block uppercase">Followers</span>
              <span id="profileFollowersCount" class="text-xs font-bold text-slate-900">0</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ユーザー一覧モーダル（フォロー/フォロワー用） -->
    <div id="userListModal" class="modal-overlay fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm hidden flex items-center justify-center p-4" onclick="handleBackdropClick(event, closeUserListModal)">
      <div class="bg-white border-2 border-slate-900 w-full max-w-sm rounded-3xl p-5 shadow-2xl">
        <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-4">
          <h2 id="userListModalTitle" class="text-xs font-bold tracking-widest uppercase">USERS</h2>
          <button onclick="closeUserListModal()" class="text-slate-400 text-xs">✕</button>
        </div>
        <div id="userListContent" class="max-h-72 overflow-y-auto divide-y divide-slate-100 text-xs"></div>
      </div>
    </div>

    <!-- 通知モーダル -->
    <div id="notificationsModal" class="modal-overlay fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm hidden flex items-center justify-center p-4" onclick="handleBackdropClick(event, closeNotificationsModal)">
      <div class="bg-white border-2 border-slate-900 w-full max-w-sm rounded-3xl p-5 shadow-2xl">
        <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-4">
          <h2 class="text-xs font-bold tracking-widest uppercase">Notifications</h2>
          <button onclick="closeNotificationsModal()" class="text-slate-400 text-xs">✕</button>
        </div>
        <div id="notificationsList" class="max-h-80 overflow-y-auto divide-y divide-slate-100 text-xs"></div>
      </div>
    </div>

    <!-- 検索モーダル -->
    <div id="userSearchModal" class="modal-overlay fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm hidden flex items-center justify-center p-4" onclick="handleBackdropClick(event, closeUserSearchModal)">
      <div class="bg-white border-2 border-slate-900 w-full max-w-sm rounded-3xl p-5 shadow-2xl">
        <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-4">
          <h2 class="text-xs font-bold tracking-widest uppercase">Search Users</h2>
          <button onclick="closeUserSearchModal()" class="text-slate-400 text-xs">✕</button>
        </div>
        <div class="space-y-3">
          <div class="flex gap-2">
            <input type="text" id="userSearchInput" placeholder="@username で検索..." class="w-full rounded-xl p-2.5 text-xs navy-input">
            <button onclick="executeUserSearch()" class="navy-btn px-4 rounded-xl text-xs font-semibold">Search</button>
          </div>
          <div id="userSearchResults" class="max-h-60 overflow-y-auto divide-y divide-slate-100 text-xs"></div>
        </div>
      </div>
    </div>

    <!-- DMモーダル -->
    <div id="conversationsModal" class="modal-overlay fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm hidden flex items-center justify-center p-4" onclick="handleBackdropClick(event, closeConversationsModal)">
      <div class="bg-white border-2 border-slate-900 w-full max-w-sm rounded-3xl p-5 shadow-2xl">
        <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-4">
          <h2 class="text-xs font-bold tracking-widest uppercase">Messages</h2>
          <button onclick="closeConversationsModal()" class="text-slate-400 text-xs">✕</button>
        </div>
        <div id="conversationsList" class="max-h-72 overflow-y-auto divide-y divide-slate-100 text-xs"></div>
      </div>
    </div>
    <div id="dmModal" class="modal-overlay fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm hidden flex items-center justify-center p-4" onclick="handleBackdropClick(event, closeDmModal)">
      <div class="bg-white border-2 border-slate-900 w-full max-w-sm rounded-3xl h-[520px] flex flex-col shadow-2xl overflow-hidden">
        <div class="px-4 py-3 border-b border-slate-900 flex items-center justify-between bg-slate-50">
          <span class="text-xs font-bold" id="dmPartnerTitle">Chat</span>
          <button onclick="closeDmModal()" class="text-slate-400 text-xs">✕</button>
        </div>
        <div id="dmMessageList" class="flex-1 p-4 overflow-y-auto space-y-3 bg-white text-xs"></div>
        <form id="dmSendForm" class="p-2.5 border-t border-slate-200 bg-white flex gap-2">
          <input type="text" id="dmInput" required placeholder="メッセージ..." class="flex-1 rounded-xl p-2 text-xs navy-input">
          <button type="submit" class="navy-btn px-4 py-2 rounded-xl text-xs font-bold">送信</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    let currentFeedTab = 'all';
    let currentUser = null;
    let activeDmPartner = null;
    let currentProfileUsername = null;

    function handleBackdropClick(e, closeFunc) {
      if (e.target.classList.contains('modal-overlay')) closeFunc();
    }

    function getToken() { return localStorage.getItem('access_token'); }
    function setToken(t) { localStorage.setItem('access_token', t); }
    function removeToken() { localStorage.removeItem('access_token'); }

    function updateViewState(isLoggedIn) {
      if (isLoggedIn) {
        document.getElementById('landingView').classList.add('hidden');
        document.getElementById('appView').classList.remove('hidden');
      } else {
        document.getElementById('appView').classList.add('hidden');
        document.getElementById('landingView').classList.remove('hidden');
      }
    }

    async function checkAuth() {
      const token = getToken();
      if (!token) { updateViewState(false); renderAuthUI(null); return; }
      try {
        const res = await fetch('/auth/me', { headers: { 'Authorization': `Bearer ${token}` } });
        if (res.ok) {
          currentUser = await res.json();
          updateViewState(true);
          renderAuthUI(currentUser);
          loadSpots();
        } else {
          removeToken();
          updateViewState(false);
          renderAuthUI(null);
        }
      } catch (e) {
        updateViewState(false);
        renderAuthUI(null);
      }
    }

    function renderAuthUI(user) {
      const c = document.getElementById('authStatusContainer');
      if (user) {
        c.innerHTML = `
          <button onclick="openProfile('${user.username}')" class="navy-btn-outline text-[10px] font-bold px-3 py-1 rounded-full flex items-center gap-1">
            <span>👤</span><span>${user.display_name || user.username}</span>
          </button>
        `;
      } else {
        c.innerHTML = '';
      }
    }

    async function loadSpots() {
      const feedEl = document.getElementById('feed');
      feedEl.innerHTML = '<p class="text-center text-xs text-slate-400 py-12">Loading...</p>';
      const token = getToken();
      const res = await fetch(`/spots?feed_type=${currentFeedTab}`, {
        headers: token ? { 'Authorization': `Bearer ${token}` } : {}
      });
      const spots = await res.json();

      if (!Array.isArray(spots) || spots.length === 0) {
        feedEl.innerHTML = '<div class="text-center py-12 text-xs text-slate-400 border border-dashed border-slate-300 rounded-2xl">まだ投稿がありません</div>';
        return;
      }

      feedEl.innerHTML = spots.map(s => {
        const d = new Date(s.visited_at);
        const dateStr = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
        return `
          <article class="navy-card rounded-2xl overflow-hidden">
            <div class="px-4 py-3 flex items-center justify-between border-b border-slate-900 bg-white">
              <div class="flex items-center gap-2 cursor-pointer" onclick="openProfile('${s.username}')">
                <div class="w-7 h-7 rounded-lg bg-slate-200 bg-cover bg-center border border-slate-400 flex items-center justify-center font-bold text-xs" ${s.author_avatar_url ? `style="background-image:url('${s.author_avatar_url}')"` : ''}>
                  ${!s.author_avatar_url ? (s.display_name || s.username).charAt(0).toUpperCase() : ''}
                </div>
                <div>
                  <div class="text-xs font-bold text-slate-900">${s.display_name || s.username}</div>
                  <div class="text-[10px] text-slate-400 font-mono">@${s.username}</div>
                </div>
              </div>
              <a href="${s.google_map_url}" target="_blank" class="navy-btn-outline text-[10px] font-bold px-2.5 py-1 rounded-full">MAP ↗</a>
            </div>
            ${s.media_url ? `<img src="${s.media_url}" class="w-full max-h-[400px] object-cover border-b border-slate-100" />` : ''}
            <div class="p-4 bg-white">
              <h2 class="font-bold text-sm text-slate-900 mb-1">${s.name}</h2>
              <p class="text-xs text-slate-600 leading-relaxed">${s.memo || ''}</p>
              <span class="text-[9px] text-slate-400 font-mono mt-2 block">${dateStr}</span>
            </div>
          </article>
        `;
      }).join('');
    }

    window.openProfile = async function(username) {
      currentProfileUsername = username;
      const token = getToken();
      const res = await fetch(`/users/${username}`, { headers: token ? { 'Authorization': `Bearer ${token}` } : {} });
      if (!res.ok) return;
      const user = await res.json();

      document.getElementById('profileDisplayName').innerText = user.display_name || user.username;
      document.getElementById('profileUsername').innerText = `@${user.username}`;
      document.getElementById('profileBio').innerText = user.bio || '自己紹介がまだありません';
      document.getElementById('profileFollowingCount').innerText = user.following_count;
      document.getElementById('profileFollowersCount').innerText = user.followers_count;

      const avatarEl = document.getElementById('profileAvatar');
      if (user.avatar_url) {
        avatarEl.style.backgroundImage = `url('${user.avatar_url}')`;
        avatarEl.innerText = '';
      } else {
        avatarEl.style.backgroundImage = 'none';
        avatarEl.innerText = (user.display_name || user.username).charAt(0).toUpperCase();
      }

      const act = document.getElementById('profileActionContainer');
      if (currentUser && currentUser.username === user.username) {
        act.innerHTML = `<button onclick="logout()" class="navy-btn-outline text-[10px] font-bold px-3 py-1 rounded-full">LOGOUT</button>`;
      } else {
        act.innerHTML = `
          <button onclick="toggleFollowUser('${user.username}')" class="navy-btn text-[10px] font-bold px-3 py-1 rounded-full">${user.is_following ? 'フォロー中' : 'フォロー'}</button>
          <button onclick="openDmChat('${user.username}')" class="navy-btn-outline text-[10px] font-bold px-2.5 py-1 rounded-full">DM ✉️</button>
        `;
      }
      document.getElementById('profileModal').classList.remove('hidden');
    };

    window.closeProfileModal = function() { document.getElementById('profileModal').classList.add('hidden'); };
    window.logout = function() { removeToken(); currentUser = null; updateViewState(false); };

    window.openUserListModal = async function(type) {
      if (!currentProfileUsername) return;
      const titleEl = document.getElementById('userListModalTitle');
      const contentEl = document.getElementById('userListContent');
      titleEl.innerText = type === 'following' ? 'FOLLOWING' : 'FOLLOWERS';
      contentEl.innerHTML = '<p class="text-center text-slate-400 py-6">読み込み中...</p>';
      document.getElementById('userListModal').classList.remove('hidden');

      try {
        const res = await fetch(`/api/users/${encodeURIComponent(currentProfileUsername)}/${type}`);
        const users = await res.json();
        if (!res.ok || users.length === 0) {
          contentEl.innerHTML = '<p class="text-center text-slate-400 py-6">ユーザーはいません</p>';
          return;
        }
        contentEl.innerHTML = users.map(u => `
          <div class="p-3 flex items-center justify-between cursor-pointer" onclick="closeUserListModal(); closeProfileModal(); openProfile('${u.username}');">
            <div class="font-bold text-slate-900">${u.display_name || u.username} <span class="text-slate-400 font-normal">@${u.username}</span></div>
            <span class="text-[10px] text-slate-800 font-bold">VIEW ↗</span>
          </div>
        `).join('');
      } catch (e) {
        contentEl.innerHTML = '<p class="text-center text-slate-400 py-6">エラーが発生しました</p>';
      }
    };
    window.closeUserListModal = function() { document.getElementById('userListModal').classList.add('hidden'); };

    window.switchFeedTab = function(tab) {
      currentFeedTab = tab;
      document.getElementById('tabAll').className = tab === 'all' ? "pb-2 text-slate-900 border-b-2 border-slate-900 font-bold" : "pb-2 text-slate-400 font-medium";
      document.getElementById('tabFollowing').className = tab === 'following' ? "pb-2 text-slate-900 border-b-2 border-slate-900 font-bold" : "pb-2 text-slate-400 font-medium";
      loadSpots();
    };

    checkAuth();
  </script>
</body>
</html>
